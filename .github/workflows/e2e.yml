name: E2E Tests — Stock System

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockuser
          POSTGRES_PASSWORD: stockpass
          POSTGRES_DB: stockdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
      EMPRESA_SLUG: ${{ secrets.EMPRESA_SLUG || 'stockobra' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/stock-system-obra-main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # ── Backend ────────────────────────────────────────────────
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Configure backend .env
        working-directory: backend
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://stockuser:stockpass@localhost:5433/stockdb
          PORT=3001
          JWT_SECRET=ci_test_secret_do_not_use_in_prod
          FRONTEND_URL=http://localhost:5173
          EOF

      - name: Run DB migrations
        working-directory: backend
        run: npx prisma migrate deploy || npx prisma db push || npm run migrate || true

      - name: Seed test data
        working-directory: backend
        run: npm run seed || true

      - name: Start backend
        working-directory: backend
        run: npm run dev &
        env:
          NODE_ENV: test

      - name: Wait for backend
        run: npx wait-on http://localhost:3001/health --timeout 30000 || curl -f http://localhost:3001 || true

      # ── Frontend ───────────────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: npm run dev &
        env:
          VITE_API_URL: http://localhost:3001

      - name: Wait for frontend
        run: npx wait-on http://localhost:5173 --timeout 30000

      # ── Playwright ─────────────────────────────────────────────
      - name: Checkout QA repo
        uses: actions/checkout@v4
        with:
          path: qa-playwright-stock

      - name: Install Playwright deps
        working-directory: qa-playwright-stock
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: qa-playwright-stock
        run: npm test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: qa-playwright-stock/playwright-report/
          retention-days: 30
